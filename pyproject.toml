[project]
name = "intelliversitybackend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "cloudinary>=1.44.1",
    "dj-database-url>=3.1.2",
    "django>=6.0.2",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.13.0",
    "django-filter>=26.1",
    "django-health-check>=4.0.4",
    "djangorestframework>=3.16.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.29.0",
    "groq>=0.4.0",
    "openpyxl>=3.1.5",
    "pillow>=12.1.1",
    "pytesseract>=0.3.10",
    "psycopg[binary]>=3.3.3",
    "requests>=2.32.5",
    "weasyprint>=68.1",
    "whitenoise>=6.11.0",
    "mcp>=1.2.0",
    "scikit-learn==1.9.1",
    "joblib>=1.4",
    "pandas>=2.2",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "black>=26.1.0",
    "flake8>=7.3.0",
    "isort>=8.0.0",
    "pytest>=9.0.2",
    "pytest-django>=4.12.0",
]

[tool.isort]
profile = "black"
